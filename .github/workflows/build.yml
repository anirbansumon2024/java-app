name: Build Android APK (Full Control)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release
          - both

      upload_release:
        description: "Upload to GitHub Release?"
        required: true
        default: "no"
        type: choice
        options:
          - yes
          - no

      version_name:
        description: "App Version Name (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

      version_code:
        description: "Version Code (e.g. 1)"
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" >> gradle.properties

      # 🔢 Set Version
      - name: Set App Version
        run: |
          VERSION_NAME=${{ github.event.inputs.version_name }}
          VERSION_CODE=${{ github.event.inputs.version_code }}

          echo "Setting versionName=$VERSION_NAME versionCode=$VERSION_CODE"

          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" app/build.gradle || true
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" app/build.gradle || true

      # ⚙️ CLEAN ABI SPLIT (NO NDK CONFLICT)
      - name: Enable ABI Split
        run: |
          echo "Configuring ABI split..."

          # remove old splits if exist
          sed -i '/splits {/,/}/d' app/build.gradle || true

          # add ABI split
          cat <<'EOF' >> app/build.gradle

android {
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }
}
EOF

      # 🔨 Debug Build
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # 🔨 Release Build
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      # 🚀 GitHub Release (optional)
      - name: Upload to GitHub Release
        if: ${{ github.event.inputs.upload_release == 'yes' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_name }}
          name: "Version ${{ github.event.inputs.version_name }}"
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
