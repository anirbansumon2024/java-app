name: Build Android APK (ABI Split)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select build type"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release
          - both

      upload_release:
        description: "Upload to GitHub Release?"
        required: true
        default: "no"
        type: choice
        options:
          - yes
          - no

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" >> gradle.properties

      # ⚙️ Inject ABI Split config
      - name: Enable ABI Split
        run: |
          echo "Injecting ABI split config..."

          sed -i '/defaultConfig {/a\
              ndk {\
                  abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"\
              }\
          ' app/build.gradle

          sed -i '/android {/a\
              splits {\
                  abi {\
                      enable true\
                      reset()\
                      include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"\
                      universalApk false\
                  }\
              }\
          ' app/build.gradle

      # 🔨 Debug Build
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APKs
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-abi
          path: app/build/outputs/apk/debug/*.apk

      # 🔨 Release Build
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Release APKs
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-abi
          path: app/build/outputs/apk/release/*.apk

      # 🚀 GitHub Release
      - name: Upload to GitHub Release
        if: ${{ github.event.inputs.upload_release == 'yes' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "ABI Build v1.${{ github.run_number }}"
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
